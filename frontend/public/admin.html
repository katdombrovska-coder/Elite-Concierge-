<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elite AI — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff7eb;
      --ink: #240029;
      --muted: #6b4f6f;
      --line: #e9d9d4;
      --accent: #ec1c8c;
      --dark: #240029;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    .admin-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 28px;
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .admin-header h1 {
      font-family: 'Bricolage Grotesque', serif;
      font-size: 28px;
      font-weight: 800;
      margin: 0;
    }
    .admin-header h1 span { color: var(--accent); }
    .admin-login {
      max-width: 400px;
      margin: 100px auto;
      text-align: center;
    }
    .admin-login input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid var(--line);
      border-radius: 16px;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      outline: none;
      margin-bottom: 12px;
    }
    .admin-login input:focus { border-color: var(--accent); }
    .admin-login button {
      padding: 14px 40px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Table */
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(36,0,41,.08);
    }
    .admin-table th {
      background: var(--dark);
      color: #fff;
      padding: 14px 18px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .admin-table td {
      padding: 14px 18px;
      font-size: 14px;
      border-bottom: 1px solid rgba(236,28,140,.06);
    }
    .admin-table tr:hover td {
      background: rgba(236,28,140,.03);
      cursor: pointer;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-submitted { background: #fff3cd; color: #856404; }
    .status-reviewed { background: #d4edda; color: #155724; }
    .status-contacted { background: #cce5ff; color: #004085; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(36,0,41,.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 24px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 32px;
    }
    .modal h2 {
      font-family: 'Bricolage Grotesque', serif;
      font-size: 22px;
      margin: 0 0 20px;
    }
    .modal-row {
      display: flex;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .modal-label {
      color: var(--muted);
      font-size: 13px;
      min-width: 140px;
      font-weight: 500;
    }
    .modal-value {
      font-size: 14px;
      flex: 1;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-actions button {
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--line);
      background: #fff;
      transition: all .18s;
    }
    .modal-actions button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .modal-actions button:hover {
      transform: translateY(-1px);
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state h2 { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <div id="admin-login" class="admin-login">
      <h1 style="font-family:'Bricolage Grotesque',serif;margin-bottom:24px;">Elite AI <span>Admin</span></h1>
      <input type="password" id="admin-pwd" placeholder="Admin password" />
      <br/>
      <button onclick="login()">Enter</button>
      <p id="login-error" style="color:var(--accent);margin-top:12px;font-size:14px;"></p>
    </div>

    <div id="admin-dashboard" style="display:none;">
      <div class="admin-header">
        <h1>Elite AI <span>Submissions</span></h1>
        <button onclick="loadSubmissions()" style="padding:10px 20px;border-radius:999px;background:var(--accent);color:#fff;border:none;font-weight:600;cursor:pointer;">↻ Refresh</button>
      </div>
      <div id="admin-content"></div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal-content"></div>
  </div>

  <script>
    let password = '';

    async function login() {
      const pwd = document.getElementById('admin-pwd').value;
      if (!pwd) return;
      password = pwd;

      const resp = await fetch('/api/admin?password=' + encodeURIComponent(pwd));
      if (resp.status === 401) {
        document.getElementById('login-error').textContent = 'Wrong password';
        return;
      }

      document.getElementById('admin-login').style.display = 'none';
      document.getElementById('admin-dashboard').style.display = 'block';
      loadSubmissions();
    }

    async function loadSubmissions() {
      const resp = await fetch('/api/admin?password=' + encodeURIComponent(password));
      const data = await resp.json();
      const subs = data.submissions || [];

      const content = document.getElementById('admin-content');

      if (subs.length === 0) {
        content.innerHTML = '<div class="empty-state"><h2>No submissions yet</h2><p>When someone completes the AI setup chat, their submission will appear here.</p></div>';
        return;
      }

      let html = '<table class="admin-table"><thead><tr><th>Date</th><th>Business</th><th>Industry</th><th>Contact</th><th>Status</th></tr></thead><tbody>';

      subs.forEach(s => {
        const date = new Date(s.created_at).toLocaleDateString();
        const status = s.submission_status || 'submitted';
        html += `<tr onclick="openModal('${s.session_id}')">
          <td>${date}</td>
          <td><strong>${s.business_name || '—'}</strong></td>
          <td>${s.industry || '—'}</td>
          <td>${s.contact_email || '—'}<br/>${s.contact_phone || ''}</td>
          <td><span class="status-badge status-${status}">${status}</span></td>
        </tr>`;
      });

      html += '</tbody></table>';
      content.innerHTML = html;
    }

    async function openModal(sessionId) {
      const resp = await fetch('/api/admin?password=' + encodeURIComponent(password));
      const data = await resp.json();
      const sub = (data.submissions || []).find(s => s.session_id === sessionId);
      if (!sub) return;

      const fields = [
        ['Business name', sub.business_name],
        ['Industry', sub.industry],
        ['Website/Links', sub.business_links],
        ['Location', sub.location_service_area],
        ['Main services', sub.main_services],
        ['Pricing', sub.pricing_info],
        ['Opening hours', sub.opening_hours],
        ['Languages', sub.languages],
        ['AI goal', sub.main_ai_goal],
        ['Booking method', sub.booking_method],
        ['Info to collect', sub.customer_info_to_collect],
        ['Common questions', sub.common_customer_questions],
        ['Escalation rules', sub.escalation_rules],
        ['Lead destination', sub.lead_destination],
        ['Destination detail', sub.lead_destination_detail],
        ['Tone', sub.tone_of_voice],
        ['Restrictions', sub.restrictions],
        ['Special rules', sub.special_business_rules],
        ['Contact name', sub.contact_name],
        ['Contact email', sub.contact_email],
        ['Contact phone', sub.contact_phone],
      ];

      let html = '<h2>' + (sub.business_name || 'Submission') + '</h2>';
      fields.forEach(([label, val]) => {
        if (!val || val === 'not specified' || val === 'not provided') return;
        html += '<div class="modal-row"><span class="modal-label">' + label + '</span><span class="modal-value">' + val + '</span></div>';
      });

      html += '<div class="modal-actions">' +
        '<button class="primary" onclick="copySummary(\'' + sessionId + '\')">Copy Summary</button>' +
        '<button onclick="updateStatus(\'' + sessionId + '\',\'reviewed\')">Mark Reviewed</button>' +
        '<button onclick="updateStatus(\'' + sessionId + '\',\'contacted\')">Mark Contacted</button>' +
        '<button onclick="closeModal()">Close</button>' +
        '</div>';

      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('modal-overlay').classList.add('open');

      // Store for copy
      window._currentSub = sub;
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
    }

    function copySummary() {
      if (!window._currentSub) return;
      const s = window._currentSub;
      let text = 'Elite AI Setup Submission\n';
      text += 'Business: ' + s.business_name + '\n';
      text += 'Industry: ' + s.industry + '\n';
      text += 'Location: ' + s.location_service_area + '\n';
      text += 'Services: ' + s.main_services + '\n';
      text += 'Pricing: ' + (s.pricing_info || 'not specified') + '\n';
      text += 'Hours: ' + s.opening_hours + '\n';
      text += 'Languages: ' + s.languages + '\n';
      text += 'AI Goal: ' + s.main_ai_goal + '\n';
      text += 'Booking: ' + s.booking_method + '\n';
      text += 'Tone: ' + s.tone_of_voice + '\n';
      text += 'Lead Dest: ' + s.lead_destination + ' — ' + (s.lead_destination_detail || '') + '\n';
      text += 'Contact: ' + s.contact_name + ' | ' + s.contact_email + ' | ' + s.contact_phone + '\n';
      text += 'Status: ' + s.submission_status + '\n';
      text += 'Date: ' + s.created_at + '\n';

      navigator.clipboard.writeText(text).then(() => {
        alert('Summary copied to clipboard!');
      });
    }

    async function updateStatus(id, status) {
      await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
        body: JSON.stringify({ id, status })
      });
      closeModal();
      loadSubmissions();
    }

    // Enter key login
    document.getElementById('admin-pwd').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
